  category: battery_aging
  statement: 'The adaptive LQR achieves 15.3% ± 2.8% reduction in battery capacity fade over 1000 operational cycles compared to the fixed-gain LQR baseline.'
  locations:
  - {line: 9, section: ABSTRACT, quote: '15.3% ± 2.8% reduction in battery capacity fade over 1000 operational cycles'}
  units: 'percent (relative reduction of capacity fade); ± statistic not stated'
  definition: 'Not defined: "operational cycle" (drive cycle? full equivalent cycle?), temperature, DoD and baseline fade are not stated.'
