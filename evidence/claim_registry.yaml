  source_data: 'None found. The aging model (Sec. 3.2) lacks k_c and k_cal and has inconsistent units (see C05), so no aging simulation can have been run as described.'
  calculation: 'None given. Sec. 6.1 line 5480 gives "2.3% per 1000 cycles = 14% improvement", not 15.3%.'
  reproducibility: not_reproducible_no_data_or_code
  consistency_checks: [CHK-FADE-PCT, CHK-FIG-CYCLES]
