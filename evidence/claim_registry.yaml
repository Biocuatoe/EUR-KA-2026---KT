# Claim registry for the EURÉKA 2026 KT report.
#
# This file records what the report CLAIMS. It is never edited to fit new results:
# test outcomes go into evidence_matrix.yaml. Quotes are verbatim substrings of
# data/processed/report/report.md at the given line (checked by tests/test_claim_registry.py).
# report.md = pandoc 3.11 conversion of the original .docx (hash below); the original is
# preserved read-only at data/raw/report/EUREKA-2026-KT.docx.
report_file: data/raw/report/EUREKA-2026-KT.docx
report_sha256: 01363A069EEB005851F6D62AC4B9DA9E3FD13A742BEBBFDFC14C802F0EDDFF8C
derived_markdown: data/processed/report/report.md

claims:

# ---------------------------------------------------------------- headline results
- id: C01
  title: Headline energy-efficiency improvement over fixed-gain LQR
  category: performance
  statement: 'The adaptive LQR achieves up to 12.5% ± 2.1% improvement in energy efficiency compared to the fixed-gain LQR baseline.'
  locations:
  - {line: 9, section: ABSTRACT, quote: 'up to 12.5% ± 2.1% improvement in energy efficiency'}
  units: 'percent (relative); meaning of ± (SD, SE, CI) not stated'
  definition: 'Not defined. Metric (Wh/km?), drive cycle, SoH, number of runs and the statistic behind ± are not given. "up to" makes it a maximum, which is incompatible with a ± interval.'
  evidence_category: claimed_simulation_result
  source_data: 'None found. No simulation code, run outputs or logs for the KT study exist on this machine (D:\EUREKA contains only LaTeX/Markdown and a figure script that draws random noise).'
  calculation: 'None given. The only body values (Sec. 6.1, lines 5468-5472) are 95 -> 85.3 Wh/km, a 10.2% reduction, not 12.5%.'
  reproducibility: not_reproducible_no_data_or_code
  consistency_checks: [CHK-ENERGY-PCT]
  provenance_notes: 'D:\EUREKA\AUDIT_REPORT.md line 28 ("Fix: Add realistic uncertainty ranges (e.g., \"12.5 ± 2.1%\")") and line 195 ("Add ±2.1%") show the ± interval was added as an editorial fix, not computed. The value already appears in the first LaTeX version (KT01_FINAL_REPORT.tex, 2026-09-07).'
  disposition: WITHDRAW_PENDING_RETEST
  disposition_note: 'Remove from abstract. Replace only with the result of the pre-registered experiment (protocol/preregistration.md), whatever its sign and size.'

- id: C02
