# Scientific evidence matrix. Status definitions and precedence: src/eureka/evidence.py
# (exported with the matrix by scripts/build_evidence.py). Artifact paths are relative to
# the project root (D:\EURÉKA 2026 - KT; D:\EUREKA-2026 before 2026-10-23).
# Raw runs: commit 38f443a (gate passed); see evidence/artifact_hashes.json.
x-artifacts:
  checks: &checks artifacts/reports/report-consistency-checks.json
  prim: &prim artifacts/reports/primary_results.json
  pairs: &pairs artifacts/tables/primary_pairs.csv
  gamma: &gamma artifacts/reports/gamma_sweep_results.json
  fam: &fam artifacts/reports/fixed_family_results.json
  rob: &rob artifacts/reports/robustness_results.json
  breakdown: &breakdown artifacts/tables/energy_breakdown.csv
