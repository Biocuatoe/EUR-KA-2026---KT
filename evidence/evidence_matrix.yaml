  implemented_experiment: 'Primary experiment; CHK-ENERGY-PCT.'
  supporting_artifacts: [*checks, *pairs]
  verification_status: CONTRADICTED
  contradictory_or_negative_evidence: '9.7 Wh/km is 10.2 %, not 9.7 %. The model gives about 49.9 Wh/km on S1 for both controllers, differing by 0.0015 Wh/km.'
  final_reporting_recommendation: 'Withdraw both numbers and every economic result derived from them (C39).'

