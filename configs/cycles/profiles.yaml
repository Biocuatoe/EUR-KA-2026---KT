# SYNTHETIC reference speed profiles (not standard cycles, not measured traffic).
# Segments: {idle: s} | {cruise: s} | {accel: m/s^2, to_kmh: target}  (accel < 0 decelerates)
# Fixed before any evaluation run (preregistration section 6).

P-TUNE:
  purpose: tuning acceptance and verification only; never used for evaluation
  segments:
  - {idle: 5}
  - {accel: 1.0, to_kmh: 20}
  - {cruise: 20}
  - {accel: 1.0, to_kmh: 40}
  - {cruise: 20}
  - {accel: -1.0, to_kmh: 0}
  - {idle: 8}
  - {accel: 0.5, to_kmh: 30}
  - {cruise: 15}
  - {accel: -0.8, to_kmh: 0}
  - {idle: 5}

S1:
  purpose: primary evaluation, synthetic urban stop-and-go 0-50 km/h
  segments:
  - {idle: 10}
  - {accel: 0.8, to_kmh: 20}
  - {cruise: 15}
  - {accel: -0.8, to_kmh: 0}
  - {idle: 15}
  - {accel: 1.0, to_kmh: 35}
  - {cruise: 30}
  - {accel: -0.6, to_kmh: 15}
  - {cruise: 10}
  - {accel: -0.9, to_kmh: 0}
  - {idle: 20}
  - {accel: 0.7, to_kmh: 50}
  - {cruise: 40}
  - {accel: -0.5, to_kmh: 30}
  - {cruise: 20}
  - {accel: 0.5, to_kmh: 45}
  - {cruise: 25}
  - {accel: -1.0, to_kmh: 0}
  - {idle: 15}
  - {accel: 1.0, to_kmh: 25}
  - {cruise: 10}
  - {accel: -0.8, to_kmh: 0}
  - {idle: 10}

S2:
  purpose: secondary evaluation, synthetic congested low-speed traffic <= 25 km/h
  segments:
  - {idle: 8}
  - {accel: 0.6, to_kmh: 10}
  - {cruise: 8}
  - {accel: -0.7, to_kmh: 0}
  - {idle: 12}
  - {accel: 0.6, to_kmh: 15}
  - {cruise: 12}
  - {accel: -0.7, to_kmh: 0}
  - {idle: 5}
  - {accel: 0.6, to_kmh: 20}
  - {cruise: 6}
  - {accel: -0.7, to_kmh: 0}
  - {idle: 10}
  - {accel: 0.6, to_kmh: 25}
  - {cruise: 15}
  - {accel: -0.7, to_kmh: 0}
  - {idle: 15}
  - {accel: 0.6, to_kmh: 15}
  - {cruise: 10}
  - {accel: -0.7, to_kmh: 0}
  - {idle: 6}
  - {accel: 0.6, to_kmh: 20}
  - {cruise: 8}
  - {accel: -0.7, to_kmh: 0}
  - {idle: 8}
